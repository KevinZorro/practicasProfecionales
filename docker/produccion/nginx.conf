# nginx de producción. El de desarrollo es docker/nginx/default.conf.
#
# Sirve los archivos de public/ que trae su propia imagen (los assets
# compilados y los de Filament) y los de /storage desde el volumen de
# imágenes públicas. Lo demás lo pasa a PHP-FPM, en el contenedor app.
#
# Escucha por HTTP. El HTTPS lo termina quien esté delante (ver
# "Producción" en el README y PROXIES_DE_CONFIANZA en .env).
# Topes contra el abuso (S-02 del informe de seguridad). nginx cuenta por la
# dirección que ve: si delante hay un proxy que no le pasa la IP real, todos
# los usuarios cuentan como uno solo. Por eso los topes son holgados: frenan a
# un cliente desbocado, no a la universidad entera entrando a la vez. Un
# ataque volumétrico de verdad se frena en el proxy o el WAF de la red.
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=pesadas:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Los mismos topes que en desarrollo (ConfiguracionLandingTest).
    client_max_body_size 36M;

    # Que las respuestas no digan qué versión de nginx corre.
    server_tokens off;

    # Un cliente que abre la conexión y se queda callado (slowloris) no
    # puede tener ocupado un worker de PHP-FPM ni una conexión sin límite.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn conexiones 100;
    limit_req zone=general burst=300 nodelay;

    # Comprime el texto (RNF10): livewire.min.js baja de 167 a 57 KB y la hoja
    # de estilos de 57 a 11 KB. No se listan imágenes WebP, video ni PDF: ya
    # van comprimidos y gastarían CPU a cambio de nada. text/html lo
    # comprime nginx sin que se pida.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets de Vite: su nombre lleva el hash del contenido, así que nunca
    # cambian. Un año de caché.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Imágenes y videos del contenido público (enlace public/storage). Si el
    # archivo no existe es un 404 directo, sin pasar por PHP. Sus nombres se
    # generan al subirlos y nunca se reescriben, así que el navegador puede
    # guardarlos un mes: en conexiones lentas no se vuelven a descargar.
    location ^~ /storage/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        # Que el navegador use el tipo que declara nginx y no lo adivine por
        # el contenido. Las imágenes se recodifican al subirlas, pero el
        # video del hero se guarda tal como llega.
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Lo que más cuesta al servidor —reportes en PDF y Excel, listas de
    # reposición y descargas de los formatos de confidencialidad— tiene un
    # tope propio, más bajo. La aplicación añade otro por usuario.
    location ~ ^/panel/(reportes/[^/]+/(excel|pdf)|supervision/(excel|pdf)|reposicion/[0-9]+/(excel|pdf)|formatos-confidencialidad/(plantilla(/[0-9]+)?|[0-9]+/documento))$ {
        limit_req zone=pesadas burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Solo index.php: ningún otro .php de public/ se ejecuta aunque
        # alguien consiguiera dejarlo ahí.
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # La raíz del código en el contenedor app, que no es este.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Nada de archivos ocultos, salvo el directorio de verificación de certificados.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
