# nginx de producción. El de desarrollo es docker/nginx/default.conf.
#
# Sirve los archivos de public/ que trae su propia imagen (los assets
# compilados y los de Filament) y los de /storage desde el volumen de
# imágenes públicas. Lo demás lo pasa a PHP-FPM, en el contenedor app.
#
# Escucha por HTTP. El HTTPS lo termina quien esté delante (ver
# "Producción" en el README y PROXIES_DE_CONFIANZA en .env).
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Los mismos topes que en desarrollo (ConfiguracionLandingTest).
    client_max_body_size 24M;

    # Que las respuestas no digan qué versión de nginx corre.
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets de Vite: su nombre lleva el hash del contenido, así que nunca
    # cambian. Un año de caché.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Imágenes y videos del contenido público (enlace public/storage). Si el
    # archivo no existe es un 404 directo, sin pasar por PHP. Sus nombres se
    # generan al subirlos y nunca se reescriben, así que el navegador puede
    # guardarlos un mes: en conexiones lentas no se vuelven a descargar.
    location ^~ /storage/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        # Que el navegador use el tipo que declara nginx y no lo adivine por
        # el contenido. Las imágenes se recodifican al subirlas, pero el
        # video del hero se guarda tal como llega.
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Solo index.php: ningún otro .php de public/ se ejecuta aunque
        # alguien consiguiera dejarlo ahí.
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # La raíz del código en el contenedor app, que no es este.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Nada de archivos ocultos, salvo el directorio de verificación de certificados.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
