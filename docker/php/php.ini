; Configuración de PHP para desarrollo. Ajustar antes de pasar a producción.
memory_limit = 512M
max_execution_time = 120

; Los consentimientos informados se suben escaneados; 20M cubre un PDF firmado.
upload_max_filesize = 20M
post_max_size = 24M

date.timezone = America/Bogota

display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
; En desarrollo el código cambia constantemente: revalidar en cada petición.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
