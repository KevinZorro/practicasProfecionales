; Configuración de PHP para desarrollo. Ajustar antes de pasar a producción.
memory_limit = 512M
max_execution_time = 120

; Los formatos de confidencialidad se suben escaneados; 32M cubre un PDF firmado y un video de hasta 30 MB (RF76).
upload_max_filesize = 32M
post_max_size = 36M

date.timezone = America/Bogota

display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
; En desarrollo el código cambia constantemente: revalidar en cada petición.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
