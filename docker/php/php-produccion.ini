; Configuración de PHP de producción. La de desarrollo es php.ini.
memory_limit = 512M
max_execution_time = 120

; Los mismos topes que en desarrollo: el formato de confidencialidad
; escaneado y el video del hero (ConfiguracionLandingTest los comprueba).
upload_max_filesize = 20M
post_max_size = 24M

date.timezone = America/Bogota

; Los errores van al registro, nunca a la pantalla: una traza expone rutas,
; consultas y a veces datos personales.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Que las respuestas no digan qué versión de PHP corre.
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; El código no cambia dentro de una imagen de producción: no hace falta
; revisar en cada petición si los archivos se modificaron. Un despliegue
; nuevo es una imagen nueva.
opcache.validate_timestamps = 0
