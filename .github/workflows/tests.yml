name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.3 · PostgreSQL 16
    runs-on: ubuntu-latest

    # Mismo motor y misma versión que en desarrollo y en producción.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laboratorio_simulacion
          POSTGRES_USER: laboratorio
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laboratorio -d laboratorio_simulacion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, intl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Cachear las dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php8.3-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          # En el runner PostgreSQL escucha en localhost, no en el servicio "db".
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          php artisan key:generate

      - name: Crear la base de datos de pruebas
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U laboratorio -d laboratorio_simulacion \
            -c 'CREATE DATABASE laboratorio_simulacion_testing;'

      - name: Comprobar el estilo del código
        run: ./vendor/bin/pint --test

      - name: Ejecutar la suite
        run: php artisan test

      # Las migraciones y los seeders no los cubre la suite: los tests de
      # Feature migran con RefreshDatabase, pero nadie ejecuta los seeders.
      - name: Comprobar migraciones y seeders
        run: php artisan migrate:fresh --seed --force

      # El histórico depende de que los down() sigan funcionando.
      - name: Comprobar la reversión de las migraciones
        run: php artisan migrate:reset --force

  # Levanta el entorno real de docker-compose.yml. Es el único sitio donde se
  # comprueba que la imagen construye, que nginx sirve la aplicación y que el
  # "composer install" del paso 5 del README funciona dentro de php:8.3-fpm.
  docker:
    name: Docker · build y arranque
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar el .env
        run: |
          cp .env.example .env
          # El código se monta desde el host: el usuario del contenedor tiene
          # que coincidir con el del runner o no podrá escribir en storage/.
          sed -i "s/^UID=.*/UID=$(id -u)/;s/^GID=.*/GID=$(id -g)/" .env

      - name: Construir la imagen de PHP
        run: docker compose build app

      - name: Levantar los cuatro servicios
        run: docker compose up -d

      - name: Comprobar que los cuatro servicios están arriba
        run: |
          docker compose ps
          for servicio in app nginx db node; do
            estado=$(docker compose ps --status running --services | grep -Fx "$servicio" || true)
            if [ -z "$estado" ]; then
              echo "::error::el servicio $servicio no está en ejecución"
              exit 1
            fi
            echo "$servicio: en ejecución"
          done

      # Este es el paso que falló cuando el lock exigía PHP 8.4.
      - name: Instalar dependencias dentro del contenedor
        run: docker compose exec -T app composer install --no-interaction --prefer-dist --no-progress

      - name: Generar la clave y migrar dentro del contenedor
        run: |
          docker compose exec -T app php artisan key:generate
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan --version

      # La página de bienvenida usa @vite y public/build no está versionado,
      # así que sin el servidor de desarrollo de Vite la respuesta sería un 500.
      # public/hot aparece cuando el servicio node termina de arrancar.
      - name: Esperar a que Vite esté listo
        run: |
          for _ in $(seq 1 60); do
            [ -f public/hot ] && break
            sleep 5
          done
          if [ ! -f public/hot ]; then
            echo "::error::el servicio node no publicó public/hot"
            docker compose logs node --tail=50
            exit 1
          fi
          echo "Vite listo: $(cat public/hot)"

      - name: Comprobar que nginx sirve la aplicación
        run: |
          codigo=$(curl -sS -o pagina.html -w '%{http_code}' \
            --retry 12 --retry-delay 5 --retry-all-errors http://localhost)
          echo "HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::nginx respondió $codigo en lugar de 200"
            head -40 pagina.html
            exit 1
          fi
          grep -q '<title>' pagina.html

      - name: Registros de los contenedores si algo falló
        if: failure()
        run: docker compose logs --tail=100

      - name: Apagar el entorno
        if: always()
        run: docker compose down -v --remove-orphans
