name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.3 · PostgreSQL 16
    runs-on: ubuntu-latest

    # Mismo motor y misma versión que en desarrollo y en producción.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laboratorio_simulacion
          POSTGRES_USER: laboratorio
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laboratorio -d laboratorio_simulacion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, intl, zip, bcmath, gd, dom, xmlreader, xmlwriter, simplexml, fileinfo, iconv
          coverage: none
          tools: composer:v2

      - name: Cachear las dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php8.3-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          # En el runner PostgreSQL escucha en localhost, no en el servicio "db".
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          php artisan key:generate

      - name: Crear la base de datos de pruebas
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U laboratorio -d laboratorio_simulacion \
            -c 'CREATE DATABASE laboratorio_simulacion_testing;'

      - name: Comprobar el estilo del código
        run: ./vendor/bin/pint --test

      # Larastan con la línea base: cae con cualquier error nuevo, y también
      # si se arregla uno de la línea base sin regenerarla (ver phpstan.neon).
      - name: Análisis estático
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Ejecutar la suite
        run: php artisan test

      # Las migraciones y los seeders no los cubre la suite: los tests de
      # Feature migran con RefreshDatabase, pero nadie ejecuta los seeders.
      - name: Comprobar migraciones y seeders
        run: php artisan migrate:fresh --seed --force

      # El histórico depende de que los down() sigan funcionando.
      - name: Comprobar la reversión de las migraciones
        run: php artisan migrate:reset --force

  # Levanta el entorno real de docker-compose.yml. Es el único sitio donde se
  # comprueba que la imagen construye, que nginx sirve la aplicación y que el
  # "composer install" del paso 5 del README funciona dentro de php:8.3-fpm.
  docker:
    name: Docker · build y arranque
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar el .env
        run: |
          cp .env.example .env
          # El código se monta desde el host: el usuario del contenedor tiene
          # que coincidir con el del runner o no podrá escribir en storage/.
          sed -i "s/^UID=.*/UID=$(id -u)/;s/^GID=.*/GID=$(id -g)/" .env

      - name: Construir la imagen de PHP
        run: docker compose build app

      - name: Levantar los servicios
        run: docker compose up -d

      - name: Comprobar que los servicios están arriba
        run: |
          docker compose ps
          for servicio in app queue programador nginx db node; do
            estado=$(docker compose ps --status running --services | grep -Fx "$servicio" || true)
            if [ -z "$estado" ]; then
              echo "::error::el servicio $servicio no está en ejecución"
              exit 1
            fi
            echo "$servicio: en ejecución"
          done

      # Este es el paso que falló cuando el lock exigía PHP 8.4.
      - name: Instalar dependencias dentro del contenedor
        run: docker compose exec -T app composer install --no-interaction --prefer-dist --no-progress

      - name: Generar la clave y migrar dentro del contenedor
        run: |
          docker compose exec -T app php artisan key:generate
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan storage:link
          docker compose exec -T app php artisan --version

      # Que el contenedor esté arriba no prueba que procese: se encola un job
      # y se espera a que la tabla jobs quede vacía. Es el fallo que dejaba
      # sin enviar el correo de resultado de las solicitudes (RF33).
      #
      # Se encola un comando de artisan y no un closure: un closure escrito
      # dentro de tinker no se puede serializar y el job ni llega a la cola.
      # Y se mira failed_jobs, porque un job que el trabajador hace fallar
      # también deja vacía la tabla jobs.
      - name: Comprobar que el trabajador de la cola procesa
        run: |
          docker compose exec -T app php artisan tinker --execute="Illuminate\Support\Facades\Artisan::queue('about');"
          for _ in $(seq 1 24); do
            pendientes=$(docker compose exec -T app php artisan tinker --execute="echo DB::table('jobs')->count();" | tr -dc '0-9')
            [ "$pendientes" = "0" ] && break
            sleep 5
          done
          if [ "$pendientes" != "0" ]; then
            echo "::error::quedan $pendientes jobs sin procesar: el servicio queue no está trabajando"
            docker compose logs queue --tail=50
            exit 1
          fi
          fallidos=$(docker compose exec -T app php artisan tinker --execute="echo DB::table('failed_jobs')->count();" | tr -dc '0-9')
          if [ "$fallidos" != "0" ]; then
            echo "::error::el trabajador procesó el job pero falló ($fallidos en failed_jobs)"
            docker compose logs queue --tail=50
            exit 1
          fi
          echo "La cola se vació: el trabajador procesa"

      # La página de bienvenida usa @vite y public/build no está versionado,
      # así que sin el servidor de desarrollo de Vite la respuesta sería un 500.
      # public/hot aparece cuando el servicio node termina de arrancar.
      - name: Esperar a que Vite esté listo
        run: |
          for _ in $(seq 1 60); do
            [ -f public/hot ] && break
            sleep 5
          done
          if [ ! -f public/hot ]; then
            echo "::error::el servicio node no publicó public/hot"
            docker compose logs node --tail=50
            exit 1
          fi
          echo "Vite listo: $(cat public/hot)"

      - name: Comprobar que nginx sirve la aplicación
        run: |
          codigo=$(curl -sS -o pagina.html -w '%{http_code}' \
            --retry 12 --retry-delay 5 --retry-all-errors http://localhost)
          echo "HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::nginx respondió $codigo en lugar de 200"
            head -40 pagina.html
            exit 1
          fi
          grep -q '<title>' pagina.html

      # Las imágenes públicas se guardan en WebP (ImagenPublicaService). La
      # imagen de PHP tiene que traer GD compilado con WebP: si no, la primera
      # foto que suba el ADMIN falla.
      - name: Comprobar que GD guarda WebP
        run: |
          docker compose exec -T app php -r 'exit(function_exists("imagewebp") && (imagetypes() & IMG_WEBP) ? 0 : 1);' \
            || { echo "::error::GD no tiene soporte WebP en la imagen de PHP"; exit 1; }

      # De punta a punta: la aplicación escribe en el volumen de archivos
      # públicos como www-data, y nginx lo sirve por /storage. Falla si el
      # volumen queda de root, si falta storage:link o si nginx no lo monta.
      - name: Comprobar que nginx sirve los archivos públicos
        run: |
          docker compose exec -T app php -r 'file_put_contents("storage/app/public/prueba-ci.txt", "servido por nginx");'
          codigo=$(curl -sS -o archivo.txt -w '%{http_code}' http://localhost/storage/prueba-ci.txt)
          echo "HTTP $codigo"
          if [ "$codigo" != "200" ] || ! grep -q 'servido por nginx' archivo.txt; then
            echo "::error::nginx no sirve storage/app/public (HTTP $codigo)"
            exit 1
          fi

      # Los assets de Filament no están versionados: los publica el script
      # "filament:upgrade" de composer.json en cada composer install. Si ese
      # script se pierde, el panel del ADMIN carga sin estilos y ningún test
      # lo nota; esta petición sí.
      - name: Comprobar que Composer publicó los assets de Filament
        run: |
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost/css/filament/filament/app.css)
          echo "HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::la hoja de estilos de Filament respondió $codigo: composer install no publicó los assets"
            exit 1
          fi

      - name: Registros de los contenedores si algo falló
        if: failure()
        run: docker compose logs --tail=100

      - name: Apagar el entorno
        if: always()
        run: docker compose down -v --remove-orphans

  # El compose de producción de punta a punta: construye las imágenes, las
  # levanta con el .env de ejemplo, y comprueba lo que ningún test de PHP ve.
  produccion:
    name: Producción · imágenes, cabeceras y copias
    runs-on: ubuntu-latest

    env:
      COMPOSE: docker compose -f docker-compose.produccion.yml

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # El ejemplo con sus marcas <...> llenas. Si al ejemplo le falta algo
      # que el compose exige, falla aquí y no en el servidor.
      - name: Preparar el .env de producción
        run: |
          cp .env.produccion.example .env
          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
            -e "s|^APP_URL=.*|APP_URL=http://localhost|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-$(openssl rand -hex 12)|" \
            -e "s|^MAIL_MAILER=.*|MAIL_MAILER=log|" \
            -e "s|^MAIL_HOST=.*|MAIL_HOST=localhost|" \
            -e "s|^MAIL_USERNAME=.*|MAIL_USERNAME=null|" \
            -e "s|^MAIL_PASSWORD=.*|MAIL_PASSWORD=null|" \
            -e "s|^MAIL_FROM_ADDRESS=.*|MAIL_FROM_ADDRESS=ci@ejemplo.edu.co|" \
            -e "s|^DIRECTORIO_COPIAS=.*|DIRECTORIO_COPIAS=${RUNNER_TEMP}/copias|" \
            .env
          if grep -n '=<' .env; then
            echo "::error::quedaron marcas <...> sin llenar en el .env"
            exit 1
          fi

      - name: Comprobar el compose de producción
        run: |
          $COMPOSE config --format json > compose.json
          # La base de datos no se publica fuera de Docker.
          if [ "$(jq '.services.db.ports // [] | length' compose.json)" != "0" ]; then
            echo "::error::el servicio db publica puertos en producción"
            exit 1
          fi
          # Los documentos privados van en su volumen en app, queue y copias.
          for servicio in app queue copias; do
            jq -e --arg s "$servicio" '.services[$s].volumes[] | select(.source == "archivos_privados")' compose.json > /dev/null \
              || { echo "::error::$servicio no monta el volumen archivos_privados"; exit 1; }
          done

      - name: Construir las imágenes
        run: $COMPOSE build

      - name: Levantar los servicios
        run: $COMPOSE up -d

      - name: Migrar
        run: |
          for _ in $(seq 1 24); do
            $COMPOSE exec -T app php artisan migrate --force && break
            sleep 5
          done
          $COMPOSE exec -T app php artisan migrate:status > /dev/null

      - name: Comprobar que sirve la portada con las cabeceras de seguridad
        run: |
          codigo=$(curl -sS -D cabeceras.txt -o pagina.html -w '%{http_code}' \
            --retry 12 --retry-delay 5 --retry-all-errors http://localhost/)
          echo "HTTP $codigo"; cat cabeceras.txt
          [ "$codigo" = "200" ] || { echo "::error::la portada respondió $codigo"; exit 1; }
          grep -q '<title>' pagina.html
          for cabecera in content-security-policy x-frame-options x-content-type-options referrer-policy permissions-policy; do
            grep -qi "^$cabecera:" cabeceras.txt || { echo "::error::falta la cabecera $cabecera"; exit 1; }
          done
          if grep -qi '^x-powered-by:' cabeceras.txt; then
            echo "::error::la respuesta dice qué versión de PHP corre"; exit 1
          fi
          if grep -qiE '^server: nginx/[0-9]' cabeceras.txt; then
            echo "::error::la respuesta dice qué versión de nginx corre"; exit 1
          fi

      # Los assets se compilan al construir la imagen: sin ellos la portada
      # responde 200 pero sin estilos.
      - name: Comprobar que nginx sirve los assets compilados y los de Filament
        run: |
          css=$(grep -oE '/build/assets/app-[A-Za-z0-9_-]+\.css' pagina.html | head -1)
          [ -n "$css" ] || { echo "::error::la portada no enlaza el CSS compilado"; exit 1; }
          curl -sS -D css.txt -o /dev/null "http://localhost$css"
          grep -q ' 200' css.txt || { echo "::error::$css no responde 200"; cat css.txt; exit 1; }
          grep -qi 'cache-control: .*immutable' css.txt || { echo "::error::$css sin caché larga"; exit 1; }
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost/css/filament/filament/app.css)
          [ "$codigo" = "200" ] || { echo "::error::la hoja de estilos de Filament respondió $codigo"; exit 1; }

      - name: Comprobar que un error no enseña trazas
        run: |
          codigo=$(curl -sS -o error.html -w '%{http_code}' http://localhost/no-existe)
          [ "$codigo" = "404" ] || { echo "::error::una ruta inexistente respondió $codigo"; exit 1; }
          if grep -qiE 'stack trace|vendor/laravel|Whoops' error.html; then
            echo "::error::la página de error enseña detalles internos"; exit 1
          fi

      - name: Comprobar que nginx sirve los archivos públicos
        run: |
          $COMPOSE exec -T app php -r 'file_put_contents("storage/app/public/prueba-ci.txt", "servido por nginx");'
          codigo=$(curl -sS -o archivo.txt -w '%{http_code}' http://localhost/storage/prueba-ci.txt)
          [ "$codigo" = "200" ] && grep -q 'servido por nginx' archivo.txt \
            || { echo "::error::nginx no sirve storage/app/public (HTTP $codigo)"; exit 1; }

      - name: Comprobar que el trabajador de la cola procesa
        run: |
          $COMPOSE exec -T app php artisan tinker --execute="Illuminate\Support\Facades\Artisan::queue('about');"
          for _ in $(seq 1 24); do
            pendientes=$($COMPOSE exec -T app php artisan tinker --execute="echo DB::table('jobs')->count();" | tr -dc '0-9')
            [ "$pendientes" = "0" ] && break
            sleep 5
          done
          [ "$pendientes" = "0" ] || { echo "::error::quedan $pendientes jobs: queue no trabaja"; $COMPOSE logs queue --tail=50; exit 1; }

      # La copia no vale si no se restaura: se hace una, se dañan los datos y
      # se comprueba que la restauración los devuelve tal como estaban.
      - name: Hacer una copia de seguridad y restaurarla
        run: |
          contar() { $COMPOSE exec -T app php artisan tinker --execute="echo DB::table('estadisticas_landing')->where('etiqueta', 'Prueba de la copia')->count();" | tr -dc '0-9'; }
          $COMPOSE exec -T app php artisan tinker --execute="DB::table('estadisticas_landing')->insert(['etiqueta' => 'Prueba de la copia', 'valor' => '1', 'orden' => 1, 'activo' => true]);"
          $COMPOSE exec -T app php -r 'file_put_contents("storage/app/private/prueba-ci.txt", "documento privado");'

          $COMPOSE exec -T copias /scripts/hacer-copia.sh
          copia=$(sudo ls "$RUNNER_TEMP/copias" | grep -E '^20..-..-.._....$' | tail -1)
          [ -n "$copia" ] || { echo "::error::no quedó ninguna copia"; exit 1; }
          echo "Copia: $copia"
          sudo stat -c '%a %n' "$RUNNER_TEMP/copias/$copia"

          # El daño.
          $COMPOSE exec -T app php artisan tinker --execute="DB::table('estadisticas_landing')->delete();"
          $COMPOSE exec -T app rm storage/app/private/prueba-ci.txt
          [ "$(contar)" = "0" ]

          $COMPOSE stop app queue programador web
          $COMPOSE run --rm restauracion "$copia"
          $COMPOSE start app queue programador web

          [ "$(contar)" = "1" ] || { echo "::error::la restauración no devolvió la fila"; exit 1; }
          $COMPOSE exec -T app cat storage/app/private/prueba-ci.txt | grep -q 'documento privado' \
            || { echo "::error::la restauración no devolvió el documento privado"; exit 1; }
          # Y la aplicación puede seguir escribiendo en lo restaurado.
          $COMPOSE exec -T app php -r 'file_put_contents("storage/app/private/despues.txt", "ok");'
          echo "Copia restaurada"

      - name: Registros de los contenedores si algo falló
        if: failure()
        run: $COMPOSE logs --tail=100

      - name: Apagar el entorno
        if: always()
        run: $COMPOSE down -v --remove-orphans
