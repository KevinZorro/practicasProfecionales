# Entorno de desarrollo del Laboratorio de Simulación Clínica.
# Las variables se leen del archivo .env de la raíz (copiado de .env.example).

services:
  # PHP 8.3-FPM: ejecuta la aplicación, artisan, composer y los tests.
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: laboratorio-simulacion/app
    container_name: laboratorio_app
    restart: unless-stopped
    user: www-data
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laboratorio

  # Servidor web: entrega los estáticos y delega el PHP al servicio app.
  nginx:
    image: nginx:alpine
    container_name: laboratorio_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laboratorio

  # PostgreSQL 16 con volumen persistente: los datos sobreviven a "docker compose down".
  db:
    image: postgres:16
    container_name: laboratorio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laboratorio_simulacion}
      POSTGRES_USER: ${DB_USERNAME:-laboratorio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laboratorio} -d ${DB_DATABASE:-laboratorio_simulacion}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - laboratorio

  # Node: compila los assets con Vite y sirve el HMR en modo desarrollo.
  node:
    image: node:22-alpine
    container_name: laboratorio_node
    restart: unless-stopped
    # Mismo usuario que el host: node_modules no queda como root en el repositorio.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      npm_config_cache: /tmp/.npm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - laboratorio

networks:
  laboratorio:
    driver: bridge

volumes:
  datos_postgres:
    driver: local
